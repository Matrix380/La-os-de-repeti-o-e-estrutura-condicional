<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de Desconto</title>
    <link rel="stylesheet" href="style.css">
    
</head>
<body>
    
    <div class="container">
        <h1>Calculadora de Desconto</h1>

        <form id="formCompra">

            <label for="valor">Valor total da compra (R$):</label>
            <input
                type="number"
                id="valor"
                name="valor"
                min="0"
                step="0.01"
                placeholder="Digite o valor da compra"
                required
            >

            <button type="submit">Calcular desconto</button>

            <label for="desconto">Valor do desconto (R$):</label>
            <input
                type="text"
                id="desconto"
                name="desconto"
                readonly
            >

            <label for="total">Total com desconto (R$):</label>
            <input
                type="text"
                id="total"
                name="total"
                readonly
            >


        </form>
    </div>

    
    <script src="main.js"></script>
    
</body>
